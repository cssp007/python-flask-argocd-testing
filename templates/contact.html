{% extends "base.html" %}

{% block content %}

<section class="page-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="page-card">

                    <div class="text-center mb-4">

                        <span class="badge hero-badge mb-3">
                            Get in touch
                        </span>

                        <h1>Contact Us</h1>

                        <p>
                            Have a question? Send us a message.
                        </p>

                    </div>

                    <form>

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Your name"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="you@example.com"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea
                                class="form-control"
                                rows="5"
                                placeholder="Write your message..."
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
